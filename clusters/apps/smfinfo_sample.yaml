apiVersion: cm-5gc.com/v1alpha1
kind: SmfInfo
metadata:
  name: smfinfo-sample
  namespace: oai
  labels:
    app.kubernetes.io/name: op-smf
    aicom.cm-5gc.com/e2e: multilice
spec:
  pLMNInfoList:
    - pLMNId:
        mcc: "001"
        mnc: "01"
  nRTAClist: "0"
  sBIFQDN: oai-smf.oai.svc.cluster.local
  cNSIIdList: ["slice-embb-ffffff", "slice-embb-000001"]
  managedNFProfile:
    nfType:
      - SMF
    hostAddr: oai-smf
    capacity: 10
  commModelList:
    - commModelType: DIRECT_COMMUNICATION_WO_NRF
  missingElements:
    useLocalSubscriptionInfo: true
    dnnConfigs:
      ims:
        ipv4Subnet: 14.1.1.0/24
        pduSessionType: IPV4V6
      oai:
        ipv4Subnet: 12.1.1.0/24
        pduSessionType: IPV4
      ora:
        ipv4Subnet: 13.1.1.0/24
        pduSessionType: IPV4
    snssaiConfigs:
      1-000001:
        fiveQi: 2
        sessionAmbrDl: 200Mbps
        sessionAmbrUl: 100Mbps
      1-FFFFFF:
        fiveQi: 5
        sessionAmbrDl: 400Mbps
        sessionAmbrUl: 200Mbps
  smfInfo:
    sNssaiSmfInfoList:
      - dnnSmfInfoList:
          - dnn: oai
          - dnn: ora
        sNSSAI:
          sd: FFFFFF
          sst: 1
      - dnnSmfInfoList:
          - dnn: ims
        sNSSAI:
          sd: "000001"
          sst: 1
